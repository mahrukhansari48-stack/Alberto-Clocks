<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Alberto Watches</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><script src="../offline/offline.js"></script></head>
<body data-root="../">
<div id="site-nav"></div>
<header class="page-hero"><div class="container text-center"><span class="eyebrow">Contact Us</span><h1 class="display-4 fw-bold">Let’s Talk Time</h1></div></header>
<section class="section"><div class="container"><div class="row g-5">
 <div class="col-lg-7 reveal"><div class="panel">
  <form data-form="contact" novalidate class="row g-3">
   <div class="col-md-6"><label class="form-label" for="n">Name</label><input id="n" name="name" class="form-control" required><div class="invalid-feedback">Name is required.</div></div>
   <div class="col-md-6"><label class="form-label" for="e">Email</label><input id="e" type="email" name="email" class="form-control"><div class="invalid-feedback">Enter a valid email.</div></div>
   <div class="col-12"><label class="form-label" for="s">Subject</label><input id="s" name="subject" class="form-control" required><div class="invalid-feedback">Subject is required.</div></div>
   <div class="col-12"><label class="form-label" for="m">Message</label><textarea id="m" name="message" rows="5" class="form-control" required></textarea><div class="invalid-feedback">Message is required.</div></div>
   <div class="col-12"><button class="btn btn-navy">Send Message</button></div><div class="form-msg"></div>
  </form></div></div>
 <div class="col-lg-5 reveal"><div class="panel navy">
  <h4>Visit or call us</h4>
  <p><i class="bi bi-envelope"></i> hello@albertowatches.example</p><p><i class="bi bi-telephone"></i> +00 000 0000000</p><p><i class="bi bi-geo-alt"></i> 123 Sample Street, Your City</p>
  <h5 class="mt-4">Business Hours</h5><p class="mb-1">Mon–Fri: 10am – 7pm</p><p class="mb-1">Sat: 11am – 5pm</p><p>Sun: Closed</p>
  <div class="social"><a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a><a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a><a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a></div>
  <a href="../index.html#faq" class="d-block mt-3 text-warning">Read our FAQ →</a>
 </div></div>
</div></div></section>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script></body></html>
