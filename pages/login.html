<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Alberto Watches</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><script src="../offline/offline.js"></script></head>
<body data-root="../" class="auth-page">
<div class="auth-bg"><span></span><span></span><span></span></div>
<a href="../index.html" class="auth-logo">Alberto <b>Watches</b></a>
<main class="auth-wrap"><div class="row g-0 auth-card">
 <div class="col-lg-6 auth-side d-none d-lg-flex"><div><h2>Welcome back</h2><p>Your next timeless piece is waiting.</p><img src="../images/watch2.jpg" alt="Featured watch" class="auth-img"></div></div>
 <div class="col-lg-6 auth-form">
  <h3 class="mb-1">Login</h3><p class="text-muted-x mb-4">Sign in to your account</p>
  <!-- NOTE: Real login needs a backend/auth service. This is a front-end demo; passwords are never stored. -->
  <form data-form="login" novalidate>
   <div class="mb-3"><label class="form-label" for="le">Email</label><input id="le" type="email" name="email" class="form-control form-control-lg" placeholder="you@email.com"><div class="invalid-feedback">Enter a valid email.</div></div>
   <div class="mb-3"><label class="form-label" for="lp">Password</label><div class="input-group"><input id="lp" type="password" name="password" class="form-control form-control-lg" placeholder="••••••"><button type="button" class="btn btn-outline-secondary toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback">Password needs 6+ characters.</div></div></div>
   <div class="d-flex justify-content-between mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="rm"><label class="form-check-label" for="rm">Remember me</label></div><a href="#" class="small">Forgot password?</a></div>
   <button class="btn btn-gold w-100 btn-lg">Login</button><div class="form-msg"></div>
  </form>
  <p class="text-center mt-4 mb-0">New here? <a href="signup.html">Create an account</a></p>
 </div>
</div></main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script></body></html>
