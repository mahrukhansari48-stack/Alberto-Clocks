<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up | Alberto Watches</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><script src="../offline/offline.js"></script></head>
<body data-root="../" class="auth-page">
<div class="auth-bg"><span></span><span></span><span></span></div>
<a href="../index.html" class="auth-logo">Alberto <b>Watches</b></a>
<main class="auth-wrap"><div class="row g-0 auth-card">
 <div class="col-lg-6 auth-side d-none d-lg-flex"><div><h2>Join Alberto</h2><p>Unlock member offers and early access.</p><img src="../images/watch6.jpg" alt="Featured watch" class="auth-img"></div></div>
 <div class="col-lg-6 auth-form">
  <h3 class="mb-1">Create Account</h3><p class="text-muted-x mb-4">Join Alberto for member offers and early access.</p>
  <form data-form="signup" novalidate>
   <div class="mb-3"><label class="form-label" for="sn">Full name</label><input id="sn" name="name" class="form-control" required><div class="invalid-feedback">Name is required.</div></div>
   <div class="mb-3"><label class="form-label" for="se">Email</label><input id="se" type="email" name="email" class="form-control"><div class="invalid-feedback">Enter a valid email.</div></div>
   <div class="mb-3"><label class="form-label" for="sp">Password</label><div class="input-group"><input id="sp" type="password" name="password" class="form-control"><button type="button" class="btn btn-outline-secondary toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback">Password needs 6+ characters.</div></div></div>
   <div class="mb-3"><label class="form-label" for="sc">Confirm password</label><input id="sc" type="password" name="confirm" class="form-control"><div class="invalid-feedback">Passwords do not match.</div></div>
   <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="terms" id="tc"><label class="form-check-label" for="tc">I agree to the Terms & Conditions</label><div class="invalid-feedback">You must accept the terms.</div></div>
   <button class="btn btn-gold w-100 btn-lg">Sign Up</button><div class="form-msg"></div>
  </form>
  <p class="text-center mt-3 mb-0">Already a member? <a href="login.html">Login</a></p>
 </div>
</div></main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script></body></html>
